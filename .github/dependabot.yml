# Weekly dependency update PRs. Minor and patch updates are grouped per project so they arrive as one PR;
# majors come one by one, because they're the ones that need reading. Security updates are separate and immediate
# once "Dependabot security updates" is enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: monthly
