name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    # Same ports as compose.test.yaml; the test setup refuses anything but these local instances
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vesper
          POSTGRES_PASSWORD: vesper
          POSTGRES_DB: vesper_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vesper -d vesper_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      # Dependency install scripts don't run; the one we need (Prisma client generation) runs explicitly
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      # Fails on any critical advisory in production dependencies (lower severities are triaged via Dependabot)
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  client:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag vesper-api:ci server

  # Applies migrations to the production database after every check passed on main.
  # Render deploys only after all checks (this one included) pass, so the schema is always updated before the code.
  migrate:
    name: Migrate production database
    needs: [server, client, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in the "production" environment, available only to this job on main
    environment: production
    defaults:
      run:
        working-directory: server
    env:
      DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
    steps:
      - name: Skip until the production database is configured
        if: env.DIRECT_URL == ''
        # Runs before checkout, when server/ doesn't exist yet
        working-directory: .
        run: echo "::notice::PRODUCTION_DIRECT_URL isn't set; skipping migrations"
      - uses: actions/checkout@v7
        if: env.DIRECT_URL != ''
      - uses: actions/setup-node@v5
        if: env.DIRECT_URL != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - if: env.DIRECT_URL != ''
        run: npm ci --ignore-scripts
      # Neon's free tier suspends an idle database, and the first connection can time out (P1001) while it wakes up
      - name: Apply migrations (retries while the database wakes up)
        if: env.DIRECT_URL != ''
        run: |
          for attempt in 1 2 3 4 5; do
            npx prisma migrate deploy && exit 0
            echo "::warning::Attempt $attempt failed; retrying in 10 s"
            sleep 10
          done
          exit 1

