# Disposable Postgres for the server's integration tests (data lives in memory only)
name: vesper-test
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vesper
      POSTGRES_PASSWORD: vesper
      POSTGRES_DB: vesper_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesper -d vesper_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
